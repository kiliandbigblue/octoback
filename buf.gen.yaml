version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/kiliandbigblue/octoback/gen/proto/go
plugins:
  # Go plugins
  - local: protoc-gen-go
    out: gen/proto/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/proto/go
    opt: paths=source_relative
  # TypeScript plugins (using local npm packages for proper version compatibility)
  - local: ./web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
  - local: ./web/node_modules/.bin/protoc-gen-connect-es
    out: web/src/gen
    opt: target=ts
  - local: ./web/node_modules/.bin/protoc-gen-connect-query
    out: web/src/gen
    opt: target=ts
