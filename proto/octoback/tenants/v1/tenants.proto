syntax = "proto3";

package octoback.tenants.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kiliandbigblue/octoback/tenants/v1;tenants";

// Tenant represents a household or group that shares grocery lists and recipes.
message Tenant {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
    string name = 2 [(buf.validate.field).string = { min_len: 1, max_len: 100 }];
    google.protobuf.Timestamp create_time = 3;
    int32 version = 4;
}

// TenantMembership represents a user's membership in a tenant.
message TenantMembership {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
    int64 tenant_id = 2 [(buf.validate.field).int64.gt = 0];
    string user_id = 3 [(buf.validate.field).string.min_len = 1];
    string role = 4; // owner, admin, or member
    google.protobuf.Timestamp create_time = 5;
}

// TenantInvitation represents an invitation to join a tenant.
message TenantInvitation {
    int64 id = 1 [(buf.validate.field).int64.gt = 0];
    int64 tenant_id = 2 [(buf.validate.field).int64.gt = 0];
    string invite_code = 3 [(buf.validate.field).string = { min_len: 1, max_len: 32 }];
    string created_by = 4;
    google.protobuf.Timestamp expires_at = 5;
    google.protobuf.Timestamp used_at = 6;
    string used_by = 7;
    google.protobuf.Timestamp create_time = 8;
}

